name: Native Qt builds

on:
  push:
    branches:
      - rewrite/cpp-qt-cross-platform
  pull_request:
    branches:
      - rewrite/cpp-qt-cross-platform
  workflow_dispatch:

jobs:
  linux-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia qtwebsockets
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build libgl1-mesa-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel

  windows-desktop:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtwebsockets
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel

  android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: qtmultimedia qtwebsockets
          cache: true
      - name: Configure Android
        shell: bash
        run: |
          QT_CMAKE="$(find "$QT_ROOT_DIR" -type f -name qt-cmake | head -n 1)"
          test -n "$QT_CMAKE"
          "$QT_CMAKE" -S . -B build-android -DCMAKE_BUILD_TYPE=Release -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
      - name: Build Android
        run: cmake --build build-android --target apk --config Release --parallel
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pavotts-android-arm64
          path: build-android/**/*.apk
          if-no-files-found: warn
