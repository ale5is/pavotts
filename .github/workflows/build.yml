name: Native Qt builds

on:
  push:
    branches:
      - rewrite/cpp-qt-cross-platform
  pull_request:
    branches:
      - rewrite/cpp-qt-cross-platform
  workflow_dispatch:

jobs:
  linux-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia qtwebsockets
          cache: true
          install-deps: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build libgl1-mesa-dev libpulse-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: pavotts-linux-x64
          path: build/PavoTTSNative

  windows-desktop:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtwebsockets
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure Windows Release GUI
        run: cmake -S . -B build-windows -DCMAKE_BUILD_TYPE=Release -DPAVOTTS_WINDOWS_GUI_SUBSYSTEM=ON
      - name: Build Windows Release GUI
        run: cmake --build build-windows --config Release --parallel
      - name: Deploy Qt runtime
        run: windeployqt --qmldir qml build-windows/Release/PavoTTSNative.exe
      - name: Include default configuration
        shell: pwsh
        run: Copy-Item config.default build-windows/Release/.config
      - name: Upload Windows Release package
        uses: actions/upload-artifact@v4
        with:
          name: pavotts-windows-x64
          path: build-windows/Release/
          include-hidden-files: true

  publish-windows-release:
    if: github.event_name != 'pull_request'
    needs: windows-desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: pavotts-windows-x64
          path: release/PavoTTS
      - name: Create ZIP
        run: |
          cd release
          zip -r PavoTTS-Windows-x64.zip PavoTTS
      - name: Publish rolling GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: PavoTTS Windows x64 - última compilación
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: release/PavoTTS-Windows-x64.zip

  android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: qtmultimedia qtwebsockets
          cache: true
      - name: Configure Android
        shell: bash
        run: |
          QT_CMAKE="$(find "$QT_ROOT_DIR" -type f -name qt-cmake | head -n 1)"
          test -n "$QT_CMAKE"
          "$QT_CMAKE" -S . -B build-android -DCMAKE_BUILD_TYPE=Release -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" -DQT_ANDROID_DEPLOYMENT_TYPE=Debug
      - name: Configure Gradle dependency mirror
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/maven-fallback.gradle" <<'EOF'
          allprojects {
              repositories {
                  maven {
                      name = "MavenCentralGoogleMirror"
                      url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                  }
              }
          }
          EOF
      - name: Build Android
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cmake --build build-android --target apk --config Release --parallel; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Android dependency resolution/build failed; retrying in 20 seconds (attempt $attempt/3)."
              sleep 20
            fi
          done
          exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pavotts-android-arm64
          path: build-android/**/*.apk
          if-no-files-found: error
