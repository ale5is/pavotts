name: Native Qt builds

on:
  push:
    branches:
      - rewrite/cpp-qt-cross-platform
  pull_request:
    branches:
      - rewrite/cpp-qt-cross-platform
  workflow_dispatch:

jobs:
  linux-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia qtwebsockets
          cache: true
          install-deps: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build libgl1-mesa-dev libpulse-dev
      - name: Configure Linux Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build Linux Release
        run: cmake --build build --config Release --parallel
      - name: Upload Linux Release
        uses: actions/upload-artifact@v4
        with:
          name: pavotts-linux-x64-release
          path: build/PavoTTSNative

  windows-desktop:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gui
            gui_subsystem: ON
          - variant: console
            gui_subsystem: OFF
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtwebsockets
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure Windows Release (${{ matrix.variant }})
        run: cmake -S . -B build-${{ matrix.variant }} -DCMAKE_BUILD_TYPE=Release -DPAVOTTS_WINDOWS_GUI_SUBSYSTEM=${{ matrix.gui_subsystem }}
      - name: Build Windows Release (${{ matrix.variant }})
        run: cmake --build build-${{ matrix.variant }} --config Release --parallel
      - name: Deploy Qt runtime
        run: windeployqt --qmldir qml build-${{ matrix.variant }}/Release/PavoTTSNative.exe
      - name: Include default configuration
        shell: pwsh
        run: Copy-Item config.default build-${{ matrix.variant }}/Release/.config
      - name: Upload Windows Release package
        uses: actions/upload-artifact@v4
        with:
          name: pavotts-windows-x64-${{ matrix.variant }}-release
          path: build-${{ matrix.variant }}/Release/
          include-hidden-files: true

  publish-release:
    if: github.event_name != 'pull_request'
    needs:
      - linux-desktop
      - windows-desktop
      - android-arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Windows GUI package
        uses: actions/download-artifact@v4
        with:
          name: pavotts-windows-x64-gui-release
          path: packages/windows-gui
      - name: Download Windows Console package
        uses: actions/download-artifact@v4
        with:
          name: pavotts-windows-x64-console-release
          path: packages/windows-console
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: pavotts-linux-x64-release
          path: packages/linux
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: pavotts-android-arm64-release
          path: packages/android
      - name: Package Release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cd packages
          zip -r ../release/PavoTTS-Windows-x64-GUI.zip windows-gui
          zip -r ../release/PavoTTS-Windows-x64-Console.zip windows-console
          zip -r ../release/PavoTTS-Linux-x64.zip linux
          APK="$(find android -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" ../release/PavoTTS-Android-arm64.apk
      - name: Publish rolling GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: PavoTTS - última compilación Release
          body: |
            Compilaciones Release automáticas de la rama rewrite/cpp-qt-cross-platform.

            - Windows GUI: sin ventana de consola.
            - Windows Console: con ventana de consola para diagnóstico.
            - Linux x64.
            - Android ARM64 (APK).
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            release/PavoTTS-Windows-x64-GUI.zip
            release/PavoTTS-Windows-x64-Console.zip
            release/PavoTTS-Linux-x64.zip
            release/PavoTTS-Android-arm64.apk

  android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: qtmultimedia qtwebsockets
          cache: true
      - name: Configure Android Release
        shell: bash
        run: |
          QT_CMAKE="$(find "$QT_ROOT_DIR" -type f -name qt-cmake | head -n 1)"
          test -n "$QT_CMAKE"
          "$QT_CMAKE" -S . -B build-android -DCMAKE_BUILD_TYPE=Release -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" -DQT_ANDROID_DEPLOYMENT_TYPE=Release
      - name: Configure Gradle dependency mirror
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/maven-fallback.gradle" <<'EOF'
          def centralMirror = {
              maven {
                  name = "MavenCentralGoogleMirror"
                  url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
              }
          }

          gradle.beforeProject { project ->
              project.buildscript.repositories {
                  centralMirror.delegate = delegate
                  centralMirror()
              }
              project.repositories {
                  centralMirror.delegate = delegate
                  centralMirror()
              }
          }
          EOF
      - name: Build Android Release APK
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cmake --build build-android --target apk --config Release --parallel; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Android dependency resolution/build failed; retrying in 20 seconds (attempt $attempt/3)."
              sleep 20
            fi
          done
          exit 1
      - name: Sign Android Release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="$(find build-android -type f -name '*release-unsigned.apk' -print -quit)"
          test -n "$APK"
          mkdir -p build-android/signed
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            test -n "${ANDROID_KEYSTORE_PASSWORD:-}"
            test -n "${ANDROID_KEY_ALIAS:-}"
            test -n "${ANDROID_KEY_PASSWORD:-}"
            KEYSTORE="$RUNNER_TEMP/pavotts-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          else
            KEYSTORE="$RUNNER_TEMP/pavotts-ci-temporary.keystore"
            STORE_PASSWORD="pavotts-ci-temporary"
            KEY_ALIAS="pavotts"
            KEY_PASSWORD="$STORE_PASSWORD"
            keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PavoTTS CI,O=ale5is,C=AR"
          fi
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out build-android/signed/PavoTTS-Android-arm64.apk "$APK"
          "$APKSIGNER" verify --verbose build-android/signed/PavoTTS-Android-arm64.apk
      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: pavotts-android-arm64-release
          path: build-android/signed/PavoTTS-Android-arm64.apk
          if-no-files-found: error
